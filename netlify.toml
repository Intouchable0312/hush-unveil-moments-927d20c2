[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"


# Static files in `dist` are served first; every other request goes to the SSR server
# generated by the Netlify build (pages, /api/public/* routes, server functions).
# The server bundle lands in .netlify/functions-internal/server, which Netlify picks up
# automatically.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
